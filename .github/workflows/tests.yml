name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            python -m pip install -c requirements-tested.txt -e '.[test]'
          else
            python -m pip install -e '.[test]'
          fi
      - name: Test planner
        run: python -m pytest -q tests
      - name: Test advice examples
        working-directory: validation
        run: python -m unittest -v test_shadow_adapter test_plan_result_connector
      - name: Check Python compilation
        run: python -m compileall -q src tests validation
      - name: Check installed command
        run: scalar-capacity-planner --help
